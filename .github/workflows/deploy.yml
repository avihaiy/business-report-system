name: CI / Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci

      - name: Ensure local binaries are executable (fix Vite permission issues)
        run: |
          if [ -d "./node_modules/.bin" ]; then
            chmod -R u+rx ./node_modules/.bin || true
            # ensure vite is executable if present
            if [ -f "./node_modules/.bin/vite" ]; then chmod u+x ./node_modules/.bin/vite || true; fi
          fi

      - name: Build client
        run: npm run build

      - name: Verify dist
        run: |
          if [ -d "dist" ]; then
            echo "dist generated:" && ls -la dist || true
          else
            echo "ERROR: dist not found" && exit 1
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          push: false
          tags: ${{ github.repository }}:latest

  publish-to-dockerhub:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/business-report-system:latest

  ssh-deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.SSH_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            cd ${{ secrets.SSH_REMOTE_DIR }} || exit 1
            docker pull ${{ secrets.DOCKER_IMAGE || 'your-docker-image:latest' }} || true
            docker-compose pull || true
            docker-compose up -d --remove-orphans
